name: Dev Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Test and build (Debug)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore "PS2 DATA File Extractor.sln"

      - name: Run tests
        run: dotnet test "PS2 DATA File Extractor.sln" --configuration Debug --no-restore

      - name: Publish dev build
        run: dotnet publish "PS2 DATA File Extractor/PS2 DATA File Extractor.csproj" --configuration Debug --no-restore --output artifacts/dev-build

      - name: Upload dev build
        uses: actions/upload-artifact@v7
        with:
          name: PS2-MET-File-Editor-dev-${{ github.sha }}
          path: artifacts/dev-build
          if-no-files-found: error
          retention-days: 14
