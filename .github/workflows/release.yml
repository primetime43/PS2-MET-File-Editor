name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  release:
    name: Test, package, and release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore "PS2 DATA File Extractor.sln"

      - name: Verify tag and release metadata
        shell: pwsh
        run: |
          [xml]$project = Get-Content "PS2 DATA File Extractor/PS2 DATA File Extractor.csproj"
          $projectVersion = $project.Project.PropertyGroup.Version
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($projectVersion -ne $tagVersion) {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $projectVersion."
          }

          $releaseNotes = "docs/releases/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $releaseNotes)) {
            throw "Missing release notes: $releaseNotes"
          }

          "RELEASE_VERSION=$projectVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NOTES=$releaseNotes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run tests
        run: dotnet test "PS2 DATA File Extractor.sln" --configuration Release --no-restore

      - name: Publish Windows x64 release
        run: >-
          dotnet publish "PS2 DATA File Extractor/PS2 DATA File Extractor.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish

      - name: Create release archive
        shell: pwsh
        run: |
          $archiveName = "Backyard-Baseball-PS2-Editor-$env:GITHUB_REF_NAME-win-x64.zip"
          $archivePath = Join-Path "artifacts" $archiveName
          Compress-Archive -Path "artifacts/publish/*" -DestinationPath $archivePath
          $checksumPath = "$archivePath.sha256"
          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -LiteralPath $checksumPath -Encoding ascii -NoNewline
          "RELEASE_ARCHIVE=$archivePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CHECKSUM=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:GITHUB_REF_NAME `
              --title $env:GITHUB_REF_NAME `
              --notes-file $env:RELEASE_NOTES
            gh release upload $env:GITHUB_REF_NAME `
              $env:RELEASE_ARCHIVE $env:RELEASE_CHECKSUM --clobber
          }
          else {
            gh release create $env:GITHUB_REF_NAME `
              $env:RELEASE_ARCHIVE $env:RELEASE_CHECKSUM `
              --verify-tag `
              --notes-file $env:RELEASE_NOTES `
              --title $env:GITHUB_REF_NAME
          }
